name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        # Le projet compile contre le SDK 37 (requis par permission_handler_android).
        # On n'installe pas la plateforme manuellement ici : Gradle/AGP la
        # télécharge automatiquement pendant `flutter build`, une fois les
        # licences acceptées.
        run: yes | sdkmanager --licenses || true

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # --split-per-abi génère un APK distinct par architecture processeur
      # au lieu d'un unique fichier "universel" contenant les trois : chacun
      # est beaucoup plus léger à télécharger/installer. arm64-v8a couvre la
      # quasi-totalité des téléphones Android récents (2018+).
      - run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: miqat-app-release
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
